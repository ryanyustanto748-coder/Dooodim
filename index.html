<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengalihkan Halaman...</title>

    <!-- 1. Meta Refresh: Redirect otomatis dalam 0 detik (fallback jika JS mati) -->
    <meta http-equiv="refresh" content="0; url=https://www.videyy.biz.id">

    <!-- 2. Canonical Tag: Memberitahu mesin pencari (Google) alamat tujuan utama -->
    <link rel="canonical" href="https://www.videyy.biz.id">

    <!-- 3. JavaScript Redirect: Cara tercepat dan tidak merusak tombol 'Back' browser -->
    <script type="text/javascript">
        window.location.replace("https://www.videyy.biz.id");
    </script>
</head>
<body>
    <!-- 4. Tautan Manual: Fallback terakhir jika browser memblokir redirect otomatis -->
    <p>Halaman ini telah pindah. Jika Anda tidak dialihkan secara otomatis dalam beberapa detik, silakan <a href="https://www.videyy.biz.id">klik di sini</a>.</p>
</body>
</html>
